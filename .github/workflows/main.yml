name: Check & Clean Dead Hosts

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 00:00
  workflow_dispatch:      # Manual run

jobs:
  check-hosts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Check alive/dead hosts
        run: |
          HOST_FILE="host/host.txt"
          
          if [ ! -f "$HOST_FILE" ]; then
            echo "❌ File $HOST_FILE not found!"
            exit 1
          fi
          
          echo "📂 Processing: $HOST_FILE"
          
          # Extract domains (lines starting with 0.0.0.0)
          grep -E '^0\.0\.0\.0 ' "$HOST_FILE" | awk '{print $2}' > domains.txt
          
          COUNT=$(wc -l < domains.txt)
          echo "🔍 Checking $COUNT domains..."
          
          > dead_hosts.txt
          > alive_hosts.txt
          
          while read domain; do
            if [ -z "$domain" ]; then continue; fi
            if ping -c 1 -W 3 "$domain" > /dev/null 2>&1; then
              echo "✅ $domain" >> alive_hosts.txt
            else
              echo "❌ $domain" >> dead_hosts.txt
            fi
          done < domains.txt
          
          echo "=== RESULTS ==="
          echo "✅ Alive: $(wc -l < alive_hosts.txt)"
          echo "❌ Dead: $(wc -l < dead_hosts.txt)"
          
          # Remove dead domains
          if [ -s dead_hosts.txt ]; then
            echo "🗑️ Removing dead domains:"
            cat dead_hosts.txt
            grep -Fv -f <(awk '{print $1}' dead_hosts.txt) "$HOST_FILE" > temp_host.txt
            mv temp_host.txt "$HOST_FILE"
          fi
          
      - name: Commit changes
        if: always()
        run: |
          HOST_FILE="host/host.txt"
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add "$HOST_FILE"
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-remove dead domains $(date +'%Y-%m-%d')"
            git push
          else
            echo "📭 No changes"
          fi
